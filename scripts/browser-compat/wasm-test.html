<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LiteParse WASM Browser Test</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <div id="status">loading</div>
  <div id="result" style="display:none"></div>
  <div id="error" style="display:none"></div>

  <script type="module">
    const status = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const errorEl = document.getElementById("error");

    function buildBlankPdf(pageCount = 1) {
      const kids = Array.from(
        { length: pageCount },
        (_, index) => `${3 + index * 2} 0 R`,
      ).join(" ");
      const objects = [
        "<< /Type /Catalog /Pages 2 0 R >>",
        `<< /Type /Pages /Kids [${kids}] /Count ${pageCount} >>`,
      ];

      for (let index = 0; index < pageCount; index += 1) {
        const contentId = 4 + index * 2;
        const pageWidth = 72 + index;
        objects.push(
          `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} 72] /Resources << >> /Contents ${contentId} 0 R >>`,
          "<< /Length 0 >>\nstream\n\nendstream",
        );
      }

      let pdf = "%PDF-1.4\n%1234\n";
      const offsets = [0];
      for (let index = 0; index < objects.length; index += 1) {
        offsets.push(pdf.length);
        pdf += `${index + 1} 0 obj\n${objects[index]}\nendobj\n`;
      }

      const xrefOffset = pdf.length;
      pdf += `xref\n0 ${objects.length + 1}\n`;
      pdf += "0000000000 65535 f \n";
      for (const offset of offsets.slice(1)) {
        pdf += `${String(offset).padStart(10, "0")} 00000 n \n`;
      }
      pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\n`;
      pdf += `startxref\n${xrefOffset}\n%%EOF\n`;
      return new TextEncoder().encode(pdf);
    }

    try {
      status.textContent = "loading wasm";
      const { default: init, LiteParse } = await import("/packages/wasm/pkg/liteparse_wasm.js");
      await init();

      status.textContent = "creating parser";
      const parser = new LiteParse({ ocrEnabled: false, outputFormat: "text", quiet: true });

      status.textContent = "fetching pdf";
      const resp = await fetch("/demo/docs/apple-10k-2024.pdf");
      if (!resp.ok) throw new Error(`Failed to fetch PDF: ${resp.status}`);
      const bytes = new Uint8Array(await resp.arrayBuffer());

      status.textContent = "parsing";
      const result = await parser.parse(bytes);

      const pageCount = result.pages.length;
      const textLength = result.text.length;
      const hasText = textLength > 100;

      if (pageCount === 0) throw new Error("No pages parsed");
      if (!hasText) throw new Error(`Text too short: ${textLength} chars`);

      status.textContent = "testing OCR callback";
      let ocrCallbackCalls = 0;
      let ocrByteLength = 0;
      const ocrParser = new LiteParse({
        ocrEnabled: true,
        ocrLanguage: "eng",
        outputFormat: "text",
        dpi: 72,
        quiet: true,
        ocrEngine: {
          async recognize(imageData, width, height, language) {
            ocrCallbackCalls += 1;
            if (!(imageData instanceof Uint8Array)) {
              throw new Error("OCR input is not a Uint8Array");
            }
            if (imageData.length === 0) {
              throw new Error("OCR input is empty");
            }
            const pngSignature = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
            if (!pngSignature.every((byte, index) => imageData[index] === byte)) {
              throw new Error("OCR input is not PNG-encoded");
            }
            if (width <= 0 || height <= 0) {
              throw new Error(`Invalid OCR dimensions: ${width}x${height}`);
            }
            if (language !== "eng") {
              throw new Error(`Unexpected OCR language: ${language}`);
            }

            ocrByteLength = imageData.length;
            return [{
              text: "WASM_OCR_CALLBACK_OK",
              bbox: [4, 4, Math.max(8, width - 4), Math.min(24, height - 4)],
              confidence: 0.99,
            }];
          },
        },
      });
      const ocrResult = await ocrParser.parse(buildBlankPdf());

      if (ocrParser.config.numWorkers !== 1) {
        throw new Error(`Expected default OCR concurrency 1, received ${ocrParser.config.numWorkers}`);
      }
      if (ocrCallbackCalls !== 1) {
        throw new Error(`Expected one OCR callback, received ${ocrCallbackCalls}`);
      }
      if (!ocrResult.text.includes("WASM_OCR_CALLBACK_OK")) {
        throw new Error("OCR callback text was not merged into the parse result");
      }

      status.textContent = "testing concurrent OCR callbacks";
      let activeOcrCalls = 0;
      let maxActiveOcrCalls = 0;
      let concurrentOcrCalls = 0;
      const completionOrder = [];
      let firstOcrCallActive = false;
      let queuedCallStartedBeforeFirstFinished = false;
      const concurrentOcrParser = new LiteParse({
        ocrEnabled: true,
        ocrLanguage: "eng",
        outputFormat: "text",
        dpi: 72,
        quiet: true,
        numWorkers: 2,
        ocrEngine: {
          async recognize(_imageData, width, height) {
            concurrentOcrCalls += 1;
            activeOcrCalls += 1;
            maxActiveOcrCalls = Math.max(maxActiveOcrCalls, activeOcrCalls);
            if (width === 72) {
              firstOcrCallActive = true;
            } else if (width === 74 && firstOcrCallActive) {
              queuedCallStartedBeforeFirstFinished = true;
            }

            // Page 2 finishes before page 1. This verifies that LiteParse can
            // start page 3 without a batch wait and can keep page order.
            const delayMs = width === 72 ? 50 : 5;
            await new Promise((resolvePromise) => setTimeout(resolvePromise, delayMs));
            completionOrder.push(width);
            activeOcrCalls -= 1;
            if (width === 72) firstOcrCallActive = false;

            return [{
              text: `WASM_CONCURRENT_OCR_WIDTH_${width}`,
              bbox: [4, 4, Math.max(8, width - 4), Math.min(24, height - 4)],
              confidence: 0.99,
            }];
          },
        },
      });
      const concurrentResult = await concurrentOcrParser.parse(buildBlankPdf(3));

      if (concurrentOcrCalls !== 3) {
        throw new Error(`Expected three OCR callbacks, received ${concurrentOcrCalls}`);
      }
      if (maxActiveOcrCalls !== 2) {
        throw new Error(`Expected two concurrent OCR callbacks, observed ${maxActiveOcrCalls}`);
      }
      if (completionOrder[0] !== 73) {
        throw new Error(`OCR callbacks did not finish out of order: ${completionOrder}`);
      }
      if (!queuedCallStartedBeforeFirstFinished) {
        throw new Error("The queued OCR call waited for the slowest active call");
      }
      const pageTexts = concurrentResult.pages.map((page) => page.text);
      for (let index = 0; index < pageTexts.length; index += 1) {
        const expected = `WASM_CONCURRENT_OCR_WIDTH_${72 + index}`;
        if (!pageTexts[index].includes(expected)) {
          throw new Error(`Page ${index + 1} did not keep its OCR result: ${pageTexts[index]}`);
        }
      }

      status.textContent = "testing OCR failure policy";
      function deferred() {
        let resolve;
        const promise = new Promise((done) => { resolve = done; });
        return { promise, resolve };
      }
      async function withDeadline(promise, message) {
        let timer;
        try {
          return await Promise.race([
            promise,
            new Promise((_, reject) => {
              timer = setTimeout(() => reject(new Error(message)), 5000);
            }),
          ]);
        } finally {
          clearTimeout(timer);
        }
      }
      if (ocrParser.config.ocrFailureFatal !== true) {
        throw new Error("Expected OCR failures to be fatal by default");
      }
      let failureCases = 0;
      for (const numWorkers of [1, 2]) {
        for (const fatal of [true, false]) {
          const secondStarted = deferred();
          const thirdStarted = deferred();
          const failed = deferred();
          const releaseThird = deferred();
          const thirdFinished = deferred();
          const calls = [];
          let thirdActive = false;
          const failureParser = new LiteParse({
            ocrEnabled: true, dpi: 72, quiet: true, outputFormat: "text",
            numWorkers, ocrFailureFatal: fatal,
            ocrEngine: {
              async recognize(_imageData, width) {
                calls.push(width);
                if (width === 72 && numWorkers === 2) {
                  await secondStarted.promise;
                }
                if (width === 73) {
                  secondStarted.resolve();
                  if (numWorkers === 2) await thirdStarted.promise;
                  failed.resolve();
                  throw new Error("EXPECTED_OCR_PAGE_FAILURE");
                }
                if (width === 74) {
                  thirdActive = true;
                  thirdStarted.resolve();
                  try {
                    await releaseThird.promise;
                  } finally {
                    thirdActive = false;
                    thirdFinished.resolve();
                  }
                }
                return [{
                  text: `OCR_SUCCESS_${width}`,
                  bbox: [4, 4, width - 4, 24], confidence: 0.99,
                }];
              },
            },
          });
          const settled = failureParser.parse(buildBlankPdf(3)).then(
            (result) => ({ result }), (error) => ({ error }),
          );
          try {
            await withDeadline(failed.promise, "The failing OCR page did not start");
            if (!fatal) releaseThird.resolve();
            const outcome = await withDeadline(settled, "OCR failure policy did not settle parse()");
            if (fatal) {
              if (!String(outcome.error).includes("EXPECTED_OCR_PAGE_FAILURE")) {
                throw new Error(`Expected a fatal OCR error with ${numWorkers} worker(s)`);
              }
              if (numWorkers === 1 && calls.join(",") !== "72,73") {
                throw new Error("Serial OCR started another page after a fatal error");
              }
              if (numWorkers === 2 && !thirdActive) {
                throw new Error("Fatal OCR did not reject while another call was active");
              }
            } else {
              if (outcome.error) throw outcome.error;
              const pages = outcome.result.pages;
              if (pages.length !== 3 || !pages[0].text.includes("OCR_SUCCESS_72") ||
                  pages[1].text.trim() !== "" || !pages[2].text.includes("OCR_SUCCESS_74")) {
                throw new Error("Nonfatal OCR did not preserve successful pages");
              }
            }
          } finally {
            secondStarted.resolve();
            thirdStarted.resolve();
            releaseThird.resolve();
            await withDeadline(settled, "OCR cleanup did not settle parse()");
            if (calls.includes(74)) {
              await withDeadline(thirdFinished.promise, "The active OCR call did not finish");
            }
            failureParser.free();
          }
          failureCases += 1;
        }
      }

      status.textContent = "done";
      resultEl.style.display = "block";
      resultEl.setAttribute("data-pages", pageCount);
      resultEl.setAttribute("data-text-length", textLength);
      resultEl.setAttribute("data-ocr-callbacks", ocrCallbackCalls);
      resultEl.setAttribute("data-ocr-bytes", ocrByteLength);
      resultEl.setAttribute("data-ocr-max-concurrency", maxActiveOcrCalls);
      resultEl.setAttribute("data-ocr-failure-cases", failureCases);
      resultEl.textContent = `OK: ${pageCount} pages, ${textLength} chars, OCR callback, concurrency, and ${failureCases} failure cases passed`;
    } catch (err) {
      status.textContent = "error";
      errorEl.style.display = "block";
      errorEl.textContent = err.message || String(err);
      console.error(err);
    }
  </script>
</body>
</html>
