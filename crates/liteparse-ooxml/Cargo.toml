[package]
name = "liteparse-ooxml"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "Native OOXML structure reader (vendored Skia-free subset of dxpdf)"
publish = true

[dependencies]
bitflags = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
# XLSX number formatting (§18.8.31). A faithful port of SheetJS's `ssf`, which
# is what makes it worth taking as a dependency: the reference implementation is
# JS, so a port can be diffed against its origin rather than only against a
# spec reading. Apache-2.0, one transitive dep (`regex`).
ssf-rs = "0.1"
log = "0.4"
rustc-hash = "2"
# C′ measurer stack (spikes 6–8): resolution via fontdb, metrics/advances via
# skrifa. fontdb is pinned to the 0.22 line to match what resvg/usvg already
# drag into the liteparse tree, so resolution behaviour matches what the spike
# harness measured.
fontdb = "0.22"
skrifa = "0.45"
unicode-segmentation = "1.13"
unicode-properties = "0.1"
unicode-normalization = "0.1"
# `raster` feature only — pinned to the tiny-skia line resvg 0.44 already
# drags into the liteparse tree, so the feature adds ~no supply chain.
tiny-skia = { version = "0.11", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
] }

[features]
# Rasterize LayoutedPage draw commands to RGBA (native screenshot path).
raster = ["dep:tiny-skia", "dep:image"]

[dev-dependencies]
serde_json = "1"
