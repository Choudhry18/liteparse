[package]
name = "liteparse-docx"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "Native DOCX structure reader (vendored Skia-free subset of dxpdf)"
publish = true

[dependencies]
bitflags = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
log = "0.4"
rustc-hash = "2"
# C′ measurer stack (spikes 6–8): resolution via fontdb, metrics/advances via
# skrifa. fontdb is pinned to the 0.22 line to match what resvg/usvg already
# drag into the liteparse tree, so resolution behaviour matches what the spike
# harness measured.
fontdb = "0.22"
skrifa = "0.45"
unicode-segmentation = "1.13"
unicode-properties = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
